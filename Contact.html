<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Zikra Seid</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col justify-between overflow-hidden">
    <header class="bg-white shadow-sm shrink-0">
      <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="text-xl font-bold text-emerald-600 tracking-wider">ZIKRA-S</div>
        <nav>
          <ul class="flex space-x-6 font-medium">
            <li>
              <a href="./Home.html" class="text-gray-600 hover:text-emerald-600 transition">Home</a>
            </li>
            <li>
              <a href="./Projects.html" class="text-gray-600 hover:text-emerald-600 transition">Projects</a>
            </li>
            <li>
              <a href="./Contact.html" class="text-emerald-600 font-semibold">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="max-w-md w-full mx-auto px-4 flex flex-col justify-center flex-grow">
      <div class="text-center mb-4">
        <h1 class="text-3xl font-bold text-gray-900 tracking-tight mb-1">Get In Touch</h1>
        <p class="text-sm text-gray-500">
          Email:
          <a href="mailto:Zikraseid33@gmail.com" class="text-emerald-600 hover:underline font-medium">zikraseid@gmail.com</a>
        </p>
      </div>
      <form class="bg-white p-6 rounded-2xl shadow-xl shadow-gray-100 space-y-4">
        <div>
          <label for="name" class="block text-xs font-bold  tracking-wider text-gray-400 mb-1">YOUR NAME</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="example: John Smith"
            class="w-full px-4 py-2.5 bg-gray-50 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-400 outline-none transition" />
        </div>
        <div>
          <label for="email" class="block text-xs font-bold  tracking-wider text-gray-400 mb-1">YOUR EMAIL</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="John@gmail.com"
            class="w-full px-4 py-2.5 bg-gray-50 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-400 outline-none transition" />
        </div>

        <div>
          <label for="message" class="block text-xs font-bold  tracking-wider text-gray-400 mb-1">MESSAGE</label>
          <textarea
            id="message"
            name="message"
            rows="3"
            placeholder="I want to say..."
            class="w-full px-4 py-2.5 bg-gray-50 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-400 outline-none transition resize-none"></textarea>
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl transition shadow-lg shadow-emerald-100">
          Send Message
        </button>
      </form>
    </main>
    <footer class="bg-white py-4 text-center text-xs text-gray-400 border-t border-gray-100 shrink-0">
      <p>&copy; 2026 Zikra Seid. Built with Tailwind CSS.</p>
    </footer>
  </body>
</html>
